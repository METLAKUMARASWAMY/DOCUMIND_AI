[project]
name = "documind-ai-backend"
version = "0.1.0"
description = "FastAPI backend for DocuMind AI enterprise document intelligence."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1.0",
  "PyJWT>=2.9.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "pypdf>=6.15.0",
  "h2>=4.4.1",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.2",
  "pillow>=10.4.0",
  "pytesseract>=0.3.13",
  "opencv-python-headless>=4.10.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "reportlab>=4.2.0",
  "cryptography>=43.0.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
  "pymongo>=4.9.0",
  "qdrant-client>=1.11.0",
  "neo4j>=5.24.0",
  "minio>=7.2.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
ai = [
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "paddleocr>=2.8.0",
  "easyocr>=1.7.1",
  "transformers>=5.5.4,<6",
  "qdrant-client>=1.9.0",
  "pymongo>=4.9.0",
  "motor>=3.5.0",
  "neo4j>=5.20.0",
  "redis>=5.0.0",
  "celery>=5.4.0",
  "minio>=7.2.0",
  "ultralytics>=8.3.0",
  "opencv-python-headless>=4.10.0",
  "xgboost>=2.1.0",
  "mlflow>=2.14.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests", "tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "var*", "config*", "migrations*"]

[tool.setuptools.package-data]
"app.services.vision.schemas" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = [
  "B008",   # FastAPI intentionally uses Depends/File/Form/Query in endpoint defaults.
  "BLE001", # Optional local/enterprise adapters need defensive fallback boundaries.
  "UP042",  # Keep str Enum schemas stable for Pydantic/FastAPI OpenAPI output.
]
