name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Test backend
        working-directory: backend
        # The suite runs real Tesseract OCR over image fixtures and takes several
        # minutes; the timeout stops a hang from burning a full job slot.
        timeout-minutes: 25
        run: pytest -q --durations=15

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  container-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security-scan]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t documind/backend:ci backend
      - name: Build frontend image
        run: docker build -t documind/frontend:ci -f frontend/Dockerfile .

  deploy:
    runs-on: ubuntu-latest
    needs: container-build
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Validate Kubernetes manifests
        run: kubectl apply --dry-run=client -f infra/k8s/
      - name: Deployment handoff
        run: echo "Attach cluster credentials and registry push settings before enabling production apply."
