services:
  backend:
    build:
      context: ./backend
    environment:
      DOCUMIND_AUTH_SECRET: ${DOCUMIND_AUTH_SECRET:?Run python scripts/generate_local_env.py}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Run python scripts/generate_local_env.py}:${POSTGRES_PASSWORD:?Run python scripts/generate_local_env.py}@postgres:5432/${POSTGRES_DB:?Run python scripts/generate_local_env.py}
      DOCUMIND_DATASET_PATH: /data/documind_ai_synthetic_dataset
      ENABLE_CHROMA: "false"
      ENABLE_NEO4J: ${ENABLE_NEO4J:-true}
      ENABLE_MONGODB: "false"
      ENABLE_REDIS: "true"
      ENABLE_MINIO: "false"
      ENABLE_QDRANT: ${ENABLE_QDRANT:-true}
      MONGODB_URI: mongodb://mongodb:27017/documind
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:?Run python scripts/generate_local_env.py}
      MINIO_ENDPOINT: minio:9000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./dataset/documind_ai_synthetic_dataset:/data/documind_ai_synthetic_dataset:ro
      - ./var:/app/var
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  migrate:
    build:
      context: ./backend
    # PostgreSQL only runs /docker-entrypoint-initdb.d on a FRESH volume, so
    # migrations added after the first `up` were never applied to an existing
    # database. This service applies them explicitly on every start; the
    # migration runner is idempotent and tracked in documind_schema_migrations.
    command: ["python", "/app/scripts/migrate_postgres.py", "--execute"]
    environment:
      DOCUMIND_AUTH_SECRET: ${DOCUMIND_AUTH_SECRET:?Run python scripts/generate_local_env.py}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Run python scripts/generate_local_env.py}:${POSTGRES_PASSWORD:?Run python scripts/generate_local_env.py}@postgres:5432/${POSTGRES_DB:?Run python scripts/generate_local_env.py}
      NEO4J_AUTH: ${NEO4J_AUTH:?Run python scripts/generate_local_env.py}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./infra:/app/infra:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ./backend
    command:
      - celery
      - -A
      - app.workers.vision_tasks:celery_app
      - worker
      - --loglevel=INFO
      - -Q
      - vision-processing
      - --pool=solo
    # The worker shares the backend image and would otherwise inherit its
    # uvicorn HEALTHCHECK, which a Celery process can never pass. Ask Celery.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.vision_tasks:celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      DOCUMIND_AUTH_SECRET: ${DOCUMIND_AUTH_SECRET:?Run python scripts/generate_local_env.py}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Run python scripts/generate_local_env.py}:${POSTGRES_PASSWORD:?Run python scripts/generate_local_env.py}@postgres:5432/${POSTGRES_DB:?Run python scripts/generate_local_env.py}
      DOCUMIND_DATASET_PATH: /data/documind_ai_synthetic_dataset
      ENABLE_CHROMA: "false"
      ENABLE_NEO4J: ${ENABLE_NEO4J:-true}
      ENABLE_MONGODB: "false"
      ENABLE_REDIS: "true"
      ENABLE_MINIO: "false"
      ENABLE_QDRANT: ${ENABLE_QDRANT:-true}
      MONGODB_URI: mongodb://mongodb:27017/documind
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:?Run python scripts/generate_local_env.py}
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./dataset/documind_ai_synthetic_dataset:/data/documind_ai_synthetic_dataset:ro
      - ./var:/app/var
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run python scripts/generate_local_env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/generate_local_env.py}
      POSTGRES_DB: ${POSTGRES_DB:?Run python scripts/generate_local_env.py}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./infra/migrations/002_vision_remediation.sql:/docker-entrypoint-initdb.d/002-vision-remediation.sql:ro
      - ./infra/migrations/003_core_intelligence_v4.sql:/docker-entrypoint-initdb.d/003-core-intelligence-v4.sql:ro
      - ./infra/migrations/004_conversation_evidence_state.sql:/docker-entrypoint-initdb.d/004-conversation-evidence-state.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  chroma:
    image: chromadb/chroma:0.5.5
    profiles: ["optional"]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  neo4j:
    image: neo4j:5.22-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Run python scripts/generate_local_env.py}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:7
    profiles: ["optional"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    profiles: ["optional"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run python scripts/generate_local_env.py}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run python scripts/generate_local_env.py}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  chroma_data:
  neo4j_data:
  mongodb_data:
  redis_data:
  qdrant_data:
  minio_data:
