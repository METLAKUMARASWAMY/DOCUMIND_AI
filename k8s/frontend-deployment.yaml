apiVersion: apps/v1
kind: Deployment
metadata:
  name: documind-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documind-frontend
  template:
    metadata:
      labels:
        app: documind-frontend
    spec:
      containers:
        - name: web
          image: documind/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
