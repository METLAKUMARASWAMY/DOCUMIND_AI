server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  # The built bundle is ~1.36 MB of JavaScript. Without this it was served
  # uncompressed even to clients that asked for gzip, which is most of the
  # first-load cost on a cold cache.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Document processing is asynchronous, but report rendering and ask
    # requests are not; the default 60s read timeout cut them off.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Asset filenames carry a content hash, so a given URL's bytes never change.
  location /assets/ {
    # One directive, not two: `expires` also emits Cache-Control, and having
    # both put two of the header on every asset response.
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # The entry document must never be cached, or a deploy is invisible until the
  # browser happens to revalidate.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    try_files $uri /index.html;
  }
}
