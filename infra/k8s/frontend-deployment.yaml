apiVersion: apps/v1
kind: Deployment
metadata:
  name: documind-frontend
  namespace: documind
spec:
  replicas: 2
  selector:
    matchLabels:
      app: documind-frontend
  template:
    metadata:
      labels:
        app: documind-frontend
    spec:
      containers:
        - name: web
          image: documind/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: documind-frontend
  namespace: documind
spec:
  selector:
    app: documind-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

