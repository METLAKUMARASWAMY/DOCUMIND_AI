apiVersion: apps/v1
kind: Deployment
metadata:
  name: documind-backend
  namespace: documind
spec:
  replicas: 3
  selector:
    matchLabels:
      app: documind-backend
  template:
    metadata:
      labels:
        app: documind-backend
    spec:
      containers:
        - name: api
          image: documind/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: documind-config
            - secretRef:
                name: documind-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: documind-backend
  namespace: documind
spec:
  selector:
    app: documind-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000

