apiVersion: v1
kind: Secret
metadata:
  name: documind-secrets
  namespace: documind
type: Opaque
stringData:
  DOCUMIND_AUTH_SECRET: REPLACE_WITH_64_CHAR_RANDOM_SECRET
  DOCUMIND_DATA_ENCRYPTION_KEY: REPLACE_WITH_FERNET_KEY
  POSTGRES_USER: documind
  POSTGRES_PASSWORD: REPLACE_WITH_RANDOM_POSTGRES_PASSWORD
  POSTGRES_DB: documind
  DATABASE_URL: REPLACE_WITH_GENERATED_POSTGRES_URL
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  NEO4J_AUTH: REPLACE_WITH_NEO4J_SLASH_RANDOM_PASSWORD
