task: layoutlmv3_token_classification
base_model: microsoft/layoutlmv3-base
train_manifest: ml/prepared/layoutlmv3/splits/train.jsonl
validation_manifest: ml/prepared/layoutlmv3/splits/validation.jsonl
test_manifest: ml/prepared/layoutlmv3/splits/test.jsonl
output_dir: ml/checkpoints/layoutlmv3-token
dataset_name: documind-layout-token-annotations
dataset_version: replace-with-preparation-version
seed: 42
epochs: 12
batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 0.00002
weight_decay: 0.01
warmup_ratio: 0.1
early_stopping_patience: 3
mixed_precision: false
weighted_loss: true
metric_for_best_model: eval_loss
greater_is_better: false
mlflow_enabled: true
model_version: 1.0.0
